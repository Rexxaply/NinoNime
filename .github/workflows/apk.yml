# Membangun APK NinoNime (Capacitor) dari berkas web di repo ini.
# Jalan otomatis tiap push ke main yang mengubah berkas aplikasi (js, css, index.html, config.js, ikon, apk/, VERSION),
# atau manual dari tab Actions → "Build APK" → Run workflow.
# Nomor versi otomatis: <VERSION mayor.minor>.<nomor build>, misal 0.1.12; versionCode = nomor build (selalu naik, syarat update APK).
# Hasil: GitHub Release "apk-terbaru" berisi ninonime.apk (tautan tetap, bisa dibagikan):
#   https://github.com/<pemilik>/<repo>/releases/download/apk-terbaru/ninonime.apk
# TANDA TANGAN: Android hanya mau memperbarui APK yang ditandatangani kunci yang SAMA. Simpan kunci tetap di
# Settings → Secrets and variables → Actions → secret "ANDROID_KEYSTORE_B64" (isi: keystore dalam base64).
# Tanpa secret itu, tiap build memakai kunci acak dan pengguna harus hapus-pasang ulang. JANGAN sampai kunci hilang.
name: Build APK
on:
  push:
    branches: [main]
    paths: ["VERSION", "apk/**", "index.html", "config.js", "manifest.webmanifest", "sw.js", "css/**", "js/**", "icons/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Nomor versi
        working-directory: .
        run: |
          BASE="$(cut -d. -f1,2 VERSION)"
          echo "VER=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Berkas web
        working-directory: .
        run: |
          mkdir -p apk/www
          cp -r index.html config.js manifest.webmanifest sw.js css js icons apk/www/
          sed -i "s/VERSION: \"[^\"]*\"/VERSION: \"$VER\"/" apk/www/config.js
          mkdir -p apk/assets
          cp icons/icon-512.png apk/assets/icon-only.png
          cp icons/icon-512.png apk/assets/icon-foreground.png
          cp icons/icon-512.png apk/assets/icon-background.png

      - name: Pasang Capacitor dan proyek Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node native/patch-android.mjs com.ninonime.app   # melayang di luar aplikasi (PiP Android)
          # layar menyusut saat keyboard muncul (kolom isian tidak tertutup keyboard), sama seperti Ninokuu
          node -e "const fs=require('fs');const f='android/app/src/main/AndroidManifest.xml';let m=fs.readFileSync(f,'utf8');if(!m.includes('windowSoftInputMode'))m=m.replace(/<activity\\b/,'<activity\\n            android:windowSoftInputMode=\"adjustResize\"');fs.writeFileSync(f,m)"
          npx cap sync android

      - name: Ikon aplikasi (opsional)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0B1018' --iconBackgroundColorDark '#0B1018'

      - name: Kunci tanda tangan tetap
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Memakai kunci tetap dari secret."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 belum diisi: APK ini TIDAK bisa menimpa versi sebelumnya."
          fi

      - name: Bangun APK
        working-directory: apk/android
        run: |
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"1.0\"/versionName \"$VER\"/" app/build.gradle
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama berkas
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ninonime.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ninonime-apk
          path: apk/ninonime.apk

      - name: Rilis "apk-terbaru"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk-terbaru --yes --cleanup-tag 2>/dev/null || true
          NOTE="v$VER: $(git log -1 --pretty=%s)"
          gh release create apk-terbaru ninonime.apk --title "NinoNime v$VER" --notes "$NOTE"
